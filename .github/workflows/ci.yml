name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SANITY_PROJECT_ID: elggedkx
      SANITY_DATASET: production
      SANITY_USERS_DATASET: users-production
      SANITY_API_TOKEN: ci-build-placeholder
      JWT_SECRET: ci-build-placeholder
      CRON_SECRET: ci-build-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
